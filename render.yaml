services:
  - type: web
    name: drop-web
    env: python
    region: oregon
    plan: free
    buildCommand: "./scripts/build.sh"
    startCommand: "gunicorn drop.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: drop.settings
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: drop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: drop-redis
          property: connectionString
      - fromGroup: drop-secrets

  - type: worker
    name: drop-worker
    env: python
    region: oregon
    plan: free
    buildCommand: "./scripts/build.sh"
    startCommand: "celery -A drop worker -l info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: drop.settings
      - key: DATABASE_URL
        fromDatabase:
          name: drop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: drop-redis
          property: connectionString
      - fromGroup: drop-secrets

databases:
  - name: drop-db
    plan: free
    region: oregon

redis:
  - name: drop-redis
    plan: free
    region: oregon

envVarGroups:
  - name: drop-secrets
    envVars:
      - key: SECRET_KEY
      - key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
      - key: PAYSTACK_SECRET_KEY
      - key: ADMIN_EMAIL
      - key: SITE_URL
