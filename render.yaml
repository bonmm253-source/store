services:
  # 1. Main Web Service
  - type: web
    name: drop-web
    env: python
    buildCommand: "./scripts/build.sh"
    startCommand: "gunicorn drop.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: drop.settings
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: drop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: drop-redis
          property: connectionString

  # 2. Celery Worker (Background Tasks)
  - type: worker
    name: drop-worker
    env: python
    buildCommand: "./scripts/build.sh"
    startCommand: "celery -A drop worker -l info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: drop.settings
      - key: DATABASE_URL
        fromDatabase:
          name: drop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: drop-redis
          property: connectionString

# 3. PostgreSQL Database
databases:
  - name: drop-db
    plan: free # Change to starter for production

# 4. Redis Service (Caching/Channels)
redis:
  - name: drop-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic
