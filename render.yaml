services:
  # 1. Main Web Service
  - type: web
    name: drop-web
    env: python
    region: oregon
    buildCommand: "./scripts/build.sh"
    startCommand: "gunicorn drop.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: drop.settings
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: drop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: drop-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
      - key: PAYSTACK_SECRET_KEY
      - key: ADMIN_EMAIL
      - key: SITE_URL

  # 2. Celery Worker (Background Tasks)
  - type: worker
    name: drop-worker
    env: python
    region: oregon
    buildCommand: "./scripts/build.sh"
    startCommand: "celery -A drop worker -l info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: drop.settings
      - key: DATABASE_URL
        fromDatabase:
          name: drop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: drop-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: drop-web
          envVarKey: SECRET_KEY
      - key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
      - key: ADMIN_EMAIL

# 3. PostgreSQL Database
databases:
  - name: drop-db
    plan: free
    region: oregon

# 4. Redis Service
redis:
  - name: drop-redis
    plan: free
    region: oregon
