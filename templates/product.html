<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Page | MyStore</title>
<link rel="stylesheet" href="{% static 'css/product_page.css' %}">
</head>

<body class="product-page-body">

<header class="product-header">
  <nav class="product-nav">
    <h3>MyStore</h3>
    <div class="nav-links-wrap">
      <a href="{% url 'collection' %}">Collection</a>
      <a href="{% url 'men' %}">Men</a>
      <a href="{% url 'women' %}">Women</a>
      <a href="{% url 'wristcollection' %}">Watches</a>
       <a href="{% url 'home' %}">Home</a>
    </div>
  </nav>
</header>

<section class="product-main-section">

  <div class="product-gallery">
    <img class="main-product-img" src="/static/images/image-product-1.jpg" alt="Featured Product">
    <div class="thumbnail-list">
      <img class="selected" src="/static/images/image-product-1-thumbnail.jpg" alt="Thumbnail 1">
      <img src="/static/collection/men/images (26).jpeg" alt="Thumbnail 2">
      <img src="/media/shoes/images_70.jpeg" alt="Thumbnail 3">
      <img src="/static/collection/women/images (37).jpeg" alt="Thumbnail 4">
    </div>
  </div>

  <div class="product-details-content">
    <h3 class="product-company-label">SNEAKER COMPANY</h3>
    <h1 class="product-main-title">Fall Limited Edition Sneakers</h1>
    <p class="product-description-text">These low-profile sneakers are your perfect casual wear companion.</p>

    <div class="price-display-row">
      <span class="main-price-amount">₦125,000</span>
      <span class="discount-badge-label">50%</span>
    </div>

    <div class="action-row">
      <div class="qty-controls-group">
        <button class="qty-action-btn" id="decrease">-</button>
        <button class="qty-action-btn" id="quantity">0</button>
        <button class="qty-action-btn" id="increase">+</button>
      </div>

      <button class="add-to-cart-action-btn" id="addToCart">
        Add to Cart
      </button>
    </div>
  </div>

</section>

<!-- Lightbox -->
<div class="lightbox-overlay" id="lightbox">
  <img src="" id="lightbox-img" alt="Enlarged Product">
</div>

<!-- Cart Popup -->
<div class="cart-popup-toast" id="cartPopup">
  Item added to cart!
</div>

<script>
/* Thumbnail Click */
const mainImage = document.querySelector('.main-product-img');
const thumbnails = document.querySelectorAll('.thumbnail-list img');

thumbnails.forEach(thumb=>{
  thumb.addEventListener('click',()=>{
    mainImage.src = thumb.src;
    thumbnails.forEach(t=>t.classList.remove('selected'));
    thumb.classList.add('selected');
  });
});

/* Lightbox */
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

mainImage.addEventListener('click',()=>{
  lightbox.style.display="flex";
  lightboxImg.src = mainImage.src;
});

lightbox.addEventListener('click',()=>{
  lightbox.style.display="none";
});

/* Quantity Counter */
let qty = 0;
const quantity = document.getElementById('quantity');

document.getElementById('increase').onclick=()=>{
  qty++;
  quantity.textContent=qty;
};

document.getElementById('decrease').onclick=()=>{
  if(qty>0) qty--;
  quantity.textContent=qty;
};

/* Add to Cart Popup */
const popup = document.getElementById('cartPopup');

document.getElementById('addToCart').onclick=()=>{
  if(qty>0){
    popup.style.display="block";
    setTimeout(()=> popup.style.display="none",2000);
  }
};

/* Swipe Support */
let startX=0;

mainImage.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
});

mainImage.addEventListener("touchend",e=>{
  let endX=e.changedTouches[0].clientX;
  if(startX-endX>50) nextImage();
  if(endX-startX>50) prevImage();
});

let current=0;

function nextImage(){
  current=(current+1)%thumbnails.length;
  updateImage();
}

function prevImage(){
  current=(current-1+thumbnails.length)%thumbnails.length;
  updateImage();
}

function updateImage(){
  mainImage.src=thumbnails[current].src;
  thumbnails.forEach(t=>t.classList.remove("selected"));
  thumbnails[current].classList.add("selected");
}
</script>

</body>
</html>
